publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  llama_cpp_dart: ^0.1.7
  speech_to_text: ^7.5.0
  flutter_tts: ^4.0.2
  file_picker: ^8.1.2         # Updated to ensure web ^1.0 compatibility
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  share_plus: ^12.0.2         # Upgraded to resolve the version conflict

flutter:
  uses-material-design: true
