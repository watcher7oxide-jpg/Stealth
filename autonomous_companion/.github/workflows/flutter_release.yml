name: Build Flutter APK Release

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          echo "APK files:"
          find build/app/outputs/flutter-apk -type f -print
          
          echo ""
          echo "APK size:"
          ls -lh build/app/outputs/flutter-apk/*.apk

      - name: Prepare APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             "app-release-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Flutter APK ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            app-release-${{ github.ref_name }}.apk