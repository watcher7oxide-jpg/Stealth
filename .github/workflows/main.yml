name: Build Flutter APK Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: neural_companion

    steps:
      # ---------------------------------------------------------
      # CHECKOUT
      # ---------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # JAVA
      # ---------------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---------------------------------------------------------
      # FLUTTER
      # ---------------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ---------------------------------------------------------
      # SHOW ENVIRONMENT
      # ---------------------------------------------------------
      - name: Show Build Environment
        run: |
          echo "========================================"
          echo "BUILD ENVIRONMENT"
          echo "========================================"

          flutter --version
          dart --version

          echo ""
          echo "Project:"
          pwd

          echo ""
          echo "Pubspec:"
          grep -E "^(name|version|  file_picker:)" pubspec.yaml || true

      # ---------------------------------------------------------
      # FILE PICKER VERSION
      # ---------------------------------------------------------
      - name: Configure file_picker
        run: |
          echo "========================================"
          echo "CONFIGURING FILE PICKER"
          echo "========================================"

          sed -i 's/file_picker: .*/file_picker: ^11.0.3/' pubspec.yaml

          echo ""
          echo "Configured version:"
          grep "file_picker:" pubspec.yaml

      # ---------------------------------------------------------
      # FIX FILE PICKER 11 API
      #
      # file_picker 11.x changed:
      #
      # OLD:
      # FilePicker.platform.pickFiles()
      #
      # NEW:
      # FilePicker.pickFiles()
      # ---------------------------------------------------------
      - name: Fix FilePicker API
        run: |
          echo "========================================"
          echo "PATCHING FILE PICKER API"
          echo "========================================"

          echo ""
          echo "Occurrences BEFORE:"
          grep -n "FilePicker\.platform\.pickFiles" lib/main.dart || true

          python3 - <<'PY'
          from pathlib import Path

          path = Path("lib/main.dart")
          text = path.read_text()

          old = "FilePicker.platform.pickFiles"
          new = "FilePicker.pickFiles"

          count = text.count(old)

          print(f"Found {count} old FilePicker API occurrence(s).")

          if count:
              text = text.replace(old, new)
              path.write_text(text)

          print(f"Replaced {count} occurrence(s).")
          PY

          echo ""
          echo "Occurrences AFTER:"
          grep -n "FilePicker" lib/main.dart || true

      # ---------------------------------------------------------
      # VERIFY FILE PICKER API
      # ---------------------------------------------------------
      - name: Verify FilePicker API
        run: |
          echo "========================================"
          echo "VERIFYING FILE PICKER API"
          echo "========================================"

          if grep -n "FilePicker\.platform" lib/main.dart; then
            echo ""
            echo "ERROR: Old FilePicker.platform API still exists."
            exit 1
          fi

          echo ""
          echo "FilePicker API verified."

      # ---------------------------------------------------------
      # CLEAN
      # ---------------------------------------------------------
      - name: Clean Flutter
        run: |
          echo "========================================"
          echo "CLEANING FLUTTER"
          echo "========================================"

          flutter clean

          rm -rf build
          rm -rf .dart_tool
          rm -rf android/.gradle

          rm -rf ~/.gradle/caches
          rm -rf ~/.gradle/wrapper/dists

      # ---------------------------------------------------------
      # GET DEPENDENCIES
      # ---------------------------------------------------------
      - name: Get Dependencies
        run: |
          echo "========================================"
          echo "GETTING DEPENDENCIES"
          echo "========================================"

          rm -f pubspec.lock

          flutter pub get

      # ---------------------------------------------------------
      # VERIFY RESOLVED DEPENDENCIES
      # ---------------------------------------------------------
      - name: Verify Resolved Dependencies
        run: |
          echo "========================================"
          echo "RESOLVED DEPENDENCIES"
          echo "========================================"

          flutter pub deps --style=compact | \
            grep -E "file_picker|flutter_tts" || true

          echo ""
          echo "file_picker lock entry:"
          grep -A6 -B2 "file_picker:" pubspec.lock || true

      # ---------------------------------------------------------
      # PATCH FLUTTER_TTS FOR AGP 9
      # ---------------------------------------------------------
      - name: Patch flutter_tts for AGP 9
        run: |
          TTS_BUILD="$HOME/.pub-cache/hosted/pub.dev/flutter_tts-4.2.5/android/build.gradle"

          echo "========================================"
          echo "PATCHING FLUTTER_TTS"
          echo "========================================"

          if [ ! -f "$TTS_BUILD" ]; then
            echo "ERROR: flutter_tts build.gradle not found:"
            echo "$TTS_BUILD"
            exit 1
          fi

          python3 - "$TTS_BUILD" <<'PY'
          import sys
          import re
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          # Remove old Kotlin Android plugin declarations.
          text = re.sub(
              r'^\s*apply plugin:\s*[\'"]kotlin-android[\'"].*$',
              '',
              text,
              flags=re.MULTILINE
          )

          text = re.sub(
              r'^\s*apply plugin:\s*[\'"]org\.jetbrains\.kotlin\.android[\'"].*$',
              '',
              text,
              flags=re.MULTILINE
          )

          text = re.sub(
              r'^\s*id\s+[\'"]org\.jetbrains\.kotlin\.android[\'"].*$',
              '',
              text,
              flags=re.MULTILINE
          )

          # Remove obsolete kotlinOptions blocks.
          text = re.sub(
              r'\n\s*kotlinOptions\s*\{[^{}]*\}',
              '',
              text,
              flags=re.DOTALL
          )

          # Ensure compileSdk exists.
          if not re.search(r'\bcompileSdk(?:Version)?\s+', text):
              text = (
                  'android {\n'
                  '    compileSdk 36\n'
                  '}\n\n'
                  + text
              )

          path.write_text(text)

          print("flutter_tts patched successfully.")
          PY

      # ---------------------------------------------------------
      # PATCH OTHER FLUTTER PLUGINS FOR AGP 9
      # ---------------------------------------------------------
      - name: Patch Other Android Plugins
        run: |
          echo "========================================"
          echo "CHECKING ANDROID FLUTTER PLUGINS"
          echo "========================================"

          find "$HOME/.pub-cache/hosted/pub.dev" \
            -path "*/android/build.gradle" \
            -type f \
            -print0 | while IFS= read -r -d '' file; do

              if grep -qE \
                "kotlin-android|org.jetbrains.kotlin.android|kotlinOptions" \
                "$file"; then

                echo ""
                echo "Patching:"
                echo "$file"

                python3 - "$file" <<'PY'
          import sys
          import re
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          # Remove old Kotlin Android plugin declarations.
          text = re.sub(
              r'^\s*apply plugin:\s*[\'"]kotlin-android[\'"].*$',
              '',
              text,
              flags=re.MULTILINE
          )

          text = re.sub(
              r'^\s*apply plugin:\s*[\'"]org\.jetbrains\.kotlin\.android[\'"].*$',
              '',
              text,
              flags=re.MULTILINE
          )

          text = re.sub(
              r'^\s*id\s+[\'"]org\.jetbrains\.kotlin\.android[\'"].*$',
              '',
              text,
              flags=re.MULTILINE
          )

          # Remove obsolete kotlinOptions blocks.
          text = re.sub(
              r'\n\s*kotlinOptions\s*\{[^{}]*\}',
              '',
              text,
              flags=re.DOTALL
          )

          path.write_text(text)
          PY

              fi
          done

      # ---------------------------------------------------------
      # CONFIGURE PROJECT KOTLIN
      # ---------------------------------------------------------
      - name: Configure Kotlin
        run: |
          echo "========================================"
          echo "CONFIGURING KOTLIN"
          echo "========================================"

          if [ -f android/settings.gradle.kts ]; then

            python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/settings.gradle.kts")
          s = p.read_text()

          s = re.sub(
              r'id"org\.jetbrains\.kotlin\.android"\s+version\s+"[^"]+"\s+apply\s+false',
              'id("org.jetbrains.kotlin.android") version "2.2.20" apply false',
              s
          )

          p.write_text(s)
          PY

          fi

          echo ""
          echo "Kotlin configuration:"
          grep "org.jetbrains.kotlin.android" \
            android/settings.gradle.kts || true

      # ---------------------------------------------------------
      # AGP 9 CONFIGURATION
      # ---------------------------------------------------------
      - name: Configure Android Gradle
        run: |
          echo "========================================"
          echo "CONFIGURING ANDROID GRADLE"
          echo "========================================"

          touch android/gradle.properties

          sed -i '/^android\.builtInKotlin=/d' \
            android/gradle.properties

          sed -i '/^android\.newDsl=/d' \
            android/gradle.properties

          echo "android.builtInKotlin=true" \
            >> android/gradle.properties

          echo "android.newDsl=false" \
            >> android/gradle.properties

          echo ""
          cat android/gradle.properties

      # ---------------------------------------------------------
      # VERIFY FLUTTER_TTS
      # ---------------------------------------------------------
      - name: Verify flutter_tts
        run: |
          TTS_BUILD="$HOME/.pub-cache/hosted/pub.dev/flutter_tts-4.2.5/android/build.gradle"

          echo "========================================"
          echo "VERIFYING FLUTTER_TTS"
          echo "========================================"

          if grep -qE \
            "kotlin-android|org.jetbrains.kotlin.android" \
            "$TTS_BUILD"; then

            echo "ERROR: Old Kotlin plugin still exists."
            exit 1
          fi

          if grep -q "kotlinOptions" "$TTS_BUILD"; then
            echo "ERROR: Old kotlinOptions still exists."
            exit 1
          fi

          echo "flutter_tts AGP 9 patch verified."

      # ---------------------------------------------------------
      # DART ANALYSIS
      #
      # Catches Dart/API errors before the expensive Gradle build.
      # ---------------------------------------------------------
      - name: Validate Dart Code
        run: |
          echo "========================================"
          echo "DART ANALYSIS"
          echo "========================================"

          dart analyze --fatal-infos

      # ---------------------------------------------------------
      # BUILD RELEASE APK
      # ---------------------------------------------------------
      - name: Build Release APK
        run: |
          echo "========================================"
          echo "BUILDING RELEASE APK"
          echo "========================================"

          flutter build apk \
            --release \
            --android-skip-build-dependency-validation

      # ---------------------------------------------------------
      # VERIFY APK
      # ---------------------------------------------------------
      - name: Verify APK
        run: |
          echo "========================================"
          echo "APK GENERATED"
          echo "========================================"

          ls -lh build/app/outputs/flutter-apk/app-release.apk

          test -f build/app/outputs/flutter-apk/app-release.apk

      # ---------------------------------------------------------
      # COPY APK
      # ---------------------------------------------------------
      - name: Copy APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
            ../app-release-${GITHUB_REF_NAME}.apk

      # ---------------------------------------------------------
      # CREATE GITHUB RELEASE
      # ---------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Flutter APK ${{ github.ref_name }}"
          generate_release_notes: true
          files: neural_companion/../app-release-${{ github.ref_name }}.apk
