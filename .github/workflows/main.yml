name: Build Flutter APK Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: neural_companion

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          cache: true

      # Synchronizes AGP and Gradle wrapper to the stable 8.x pair
      - name: Align AGP 8.7.0 and Gradle 8.10.2
        run: |
          # 1. Downgrade AGP to 8.7.0 in settings.gradle.kts
          if [ -f "android/settings.gradle.kts" ]; then
            sed -i -E 's/id\("com\.android\.application"\) version "[^"]+"/id("com.android.application") version "8.7.0"/' android/settings.gradle.kts
          fi

          # 2. Downgrade Gradle Wrapper to 8.10.2
          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i -E 's/gradle-[0-9.]+-/gradle-8.10.2-/g' android/gradle/wrapper/gradle-wrapper.properties
          fi

          # 3. Strip any AGP 9 experimental flags from gradle.properties
          if [ -f "android/gradle.properties" ]; then
            sed -i '/android.builtInKotlin/d' android/gradle.properties
            sed -i '/android.newDsl/d' android/gradle.properties
          fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          echo "APK generated:"
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Copy APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
          ../app-release-${GITHUB_REF_NAME}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Flutter APK ${{ github.ref_name }}"
          generate_release_notes: true
          files: app-release-${{ github.ref_name }}.apk
