name: Build Flutter APK Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Locate Project Root
        id: locate_dir
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "TARGET_DIR=." >> $GITHUB_ENV
          elif [ -f "neural_companion/pubspec.yaml" ]; then
            echo "TARGET_DIR=neural_companion" >> $GITHUB_ENV
          else
            echo "::error::pubspec.yaml was not found in root or neural_companion/!"
            exit 1
          fi

      - name: Verify Environment
        working-directory: ${{ env.TARGET_DIR }}
        run: |
          echo "Current working directory: $PWD"
          flutter --version
          dart --version

      - name: Fetch Dependencies (Verbose)
        working-directory: ${{ env.TARGET_DIR }}
        timeout-minutes: 10
        env:
          GIT_TERMINAL_PROMPT: 0
        run: |
          echo "Clearing stale locks and caches..."
          rm -f pubspec.lock
          rm -rf .dart_tool

          echo "Running flutter pub get with real-time logs..."
          flutter pub get --verbose

      - name: Analyze Dart Code
        working-directory: ${{ env.TARGET_DIR }}
        run: |
          dart analyze

      - name: Build Release APK
        working-directory: ${{ env.TARGET_DIR }}
        timeout-minutes: 15
        run: |
          flutter build apk --release --verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ env.TARGET_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.TARGET_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
