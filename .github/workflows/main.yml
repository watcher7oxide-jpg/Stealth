name: Build Flutter APK Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: neural_companion

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          cache: true

      # Forces Gradle wrapper to 8.10.2 so Gradle 9's groovy.xml.QName crash cannot happen
      - name: Enforce Gradle 8.10.2
        run: |
          sed -i 's|gradle-9\.[0-9.]*|gradle-8.10.2|g' android/gradle/wrapper/gradle-wrapper.properties

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          echo "APK generated:"
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Copy APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
          ../app-release-${GITHUB_REF_NAME}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Flutter APK ${{ github.ref_name }}"
          generate_release_notes: true
          files: app-release-${{ github.ref_name }}.apk
