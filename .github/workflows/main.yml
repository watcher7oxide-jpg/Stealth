name: Build Flutter APK Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: autonomous_companion

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ---------------------------------------------------------
      # FORCE COMPATIBLE FILE PICKER VERSION
      # ---------------------------------------------------------
      - name: Fix file_picker Version
        run: |
          sed -i 's/file_picker: .*/file_picker: ^11.0.3/' pubspec.yaml

          echo "===== FILE PICKER ====="
          grep "file_picker:" pubspec.yaml

      # ---------------------------------------------------------
      # FORCE AGP 9 BUILT-IN KOTLIN CONFIGURATION
      # ---------------------------------------------------------
      - name: Configure Android Build
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/settings.gradle.kts")
          s = p.read_text()

          # Remove legacy Kotlin plugin declaration.
          lines = []
          for line in s.splitlines():
              if 'org.jetbrains.kotlin.android' not in line:
                  lines.append(line)

          s = "\n".join(lines) + "\n"

          p.write_text(s)
          PY

          echo "===== SETTINGS.GRADLE.KTS ====="
          cat android/settings.gradle.kts

      # ---------------------------------------------------------
      # ENABLE AGP 9 BUILT-IN KOTLIN
      # ---------------------------------------------------------
      - name: Enable Built-in Kotlin
        run: |
          if [ -f android/gradle.properties ]; then
            sed -i '/^android\.builtInKotlin=/d' android/gradle.properties
          else
            touch android/gradle.properties
          fi

          echo "android.builtInKotlin=true" >> android/gradle.properties

          echo "===== GRADLE.PROPERTIES ====="
          cat android/gradle.properties

      # ---------------------------------------------------------
      # COMPLETELY CLEAN GENERATED FILES
      # ---------------------------------------------------------
      - name: Clean Build Environment
        run: |
          flutter clean
          rm -rf build
          rm -rf .dart_tool
          rm -rf android/.gradle
          rm -rf ~/.gradle/caches
          rm -rf ~/.gradle/wrapper/dists

      # ---------------------------------------------------------
      # REGENERATE DEPENDENCIES
      # ---------------------------------------------------------
      - name: Regenerate Dependencies
        run: |
          rm -f pubspec.lock
          flutter pub get

      # ---------------------------------------------------------
      # VERIFY ACTUAL VERSIONS
      # ---------------------------------------------------------
      - name: Verify Configuration
        run: |
          echo "======================================"
          echo "FILE PICKER"
          echo "======================================"
          flutter pub deps | grep -E "file_picker|file_picker_android" || true

          echo ""
          echo "======================================"
          echo "ANDROID PLUGINS"
          echo "======================================"
          grep -E "com.android.application|org.jetbrains.kotlin.android" \
            android/settings.gradle.kts || true

          echo ""
          echo "======================================"
          echo "GRADLE VERSION"
          echo "======================================"
          grep distributionUrl \
            android/gradle/wrapper/gradle-wrapper.properties

          echo ""
          echo "======================================"
          echo "BUILT-IN KOTLIN"
          echo "======================================"
          grep android.builtInKotlin android/gradle.properties

      # ---------------------------------------------------------
      # BUILD APK
      # ---------------------------------------------------------
      - name: Build Release APK
        run: |
          flutter build apk --release

      # ---------------------------------------------------------
      # VERIFY APK
      # ---------------------------------------------------------
      - name: Verify APK
        run: |
          echo "APK generated:"
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          test -f build/app/outputs/flutter-apk/app-release.apk

      # ---------------------------------------------------------
      # COPY APK
      # ---------------------------------------------------------
      - name: Copy APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
            ../app-release-${GITHUB_REF_NAME}.apk

      # ---------------------------------------------------------
      # CREATE GITHUB RELEASE
      # ---------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Flutter APK ${{ github.ref_name }}"
          generate_release_notes: true
          files: app-release-${{ github.ref_name }}.apk
