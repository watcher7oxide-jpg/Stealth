name: Build Flutter APK Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: autonomous_companion

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ---------------------------------------------------------
      # FIX FILE PICKER VERSION
      # ---------------------------------------------------------
      - name: Fix file_picker Version
        run: |
          sed -i 's/file_picker: .*/file_picker: ^11.0.3/' pubspec.yaml

          echo "===== FILE PICKER ====="
          grep "file_picker:" pubspec.yaml

      # ---------------------------------------------------------
      # FIX KOTLIN VERSION
      # ---------------------------------------------------------
      - name: Configure Kotlin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/settings.gradle.kts")
          s = p.read_text()

          s = re.sub(
              r'id"org\.jetbrains\.kotlin\.android"\s+version\s+"[^"]+"\s+apply\s+false',
              'id("org.jetbrains.kotlin.android") version "2.2.20" apply false',
              s
          )

          p.write_text(s)
          PY

          echo "===== KOTLIN CONFIGURATION ====="
          grep "org.jetbrains.kotlin.android" android/settings.gradle.kts || true

      # ---------------------------------------------------------
      # CONFIGURE AGP 9 / FLUTTER
      # ---------------------------------------------------------
      - name: Configure Android Gradle
        run: |
          touch android/gradle.properties

          sed -i '/^android\.builtInKotlin=/d' android/gradle.properties
          sed -i '/^android\.newDsl=/d' android/gradle.properties

          echo "android.builtInKotlin=true" >> android/gradle.properties
          echo "android.newDsl=false" >> android/gradle.properties

          echo "===== GRADLE PROPERTIES ====="
          cat android/gradle.properties

      # ---------------------------------------------------------
      # CLEAN EVERYTHING GENERATED
      # ---------------------------------------------------------
      - name: Clean Build Environment
        run: |
          flutter clean
          rm -rf build
          rm -rf .dart_tool
          rm -rf android/.gradle
          rm -rf ~/.gradle/caches
          rm -rf ~/.gradle/wrapper/dists

      # ---------------------------------------------------------
      # REGENERATE DEPENDENCIES
      # ---------------------------------------------------------
      - name: Regenerate Dependencies
        run: |
          rm -f pubspec.lock
          flutter pub get

      # ---------------------------------------------------------
      # VERIFY CONFIGURATION
      # ---------------------------------------------------------
      - name: Verify Configuration
        run: |
          echo "======================================"
          echo "FILE PICKER"
          echo "======================================"
          flutter pub deps | grep -E "file_picker|file_picker_android" || true

          echo ""
          echo "======================================"
          echo "KOTLIN"
          echo "======================================"
          grep "org.jetbrains.kotlin.android" android/settings.gradle.kts || true

          echo ""
          echo "======================================"
          echo "ANDROID GRADLE PLUGIN"
          echo "======================================"
          grep "com.android.application" android/settings.gradle.kts || true

          echo ""
          echo "======================================"
          echo "GRADLE VERSION"
          echo "======================================"
          grep "distributionUrl" \
            android/gradle/wrapper/gradle-wrapper.properties || true

          echo ""
          echo "======================================"
          echo "ANDROID PROPERTIES"
          echo "======================================"
          cat android/gradle.properties

      # ---------------------------------------------------------
      # BUILD APK
      # ---------------------------------------------------------
      - name: Build Release APK
        run: |
          flutter build apk \
            --release \
            --android-skip-build-dependency-validation

      # ---------------------------------------------------------
      # VERIFY APK
      # ---------------------------------------------------------
      - name: Verify APK
        run: |
          echo "===== APK GENERATED ====="
          ls -lh build/app/outputs/flutter-apk/app-release.apk

          test -f build/app/outputs/flutter-apk/app-release.apk

      # ---------------------------------------------------------
      # COPY APK
      # ---------------------------------------------------------
      - name: Copy APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
            ../app-release-${GITHUB_REF_NAME}.apk

      # ---------------------------------------------------------
      # CREATE GITHUB RELEASE
      # ---------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Flutter APK ${{ github.ref_name }}"
          generate_release_notes: true
          files: app-release-${{ github.ref_name }}.apk
