name: Build Flutter APK Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: autonomous_companion

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ---------------------------------------------------------
      # USE FILE PICKER VERSION WITH AGP 9 SUPPORT
      # ---------------------------------------------------------
      - name: Fix file_picker Version
        run: |
          sed -i 's/file_picker: .*/file_picker: ^11.0.3/' pubspec.yaml

          echo "FILE PICKER:"
          grep "file_picker:" pubspec.yaml

      # ---------------------------------------------------------
      # CLEAN OLD GENERATED FILES
      # ---------------------------------------------------------
      - name: Clean Flutter
        run: |
          flutter clean
          rm -rf build
          rm -rf .dart_tool
          rm -rf android/.gradle
          rm -rf ~/.gradle/caches
          rm -rf ~/.gradle/wrapper/dists

      # ---------------------------------------------------------
      # REGENERATE DEPENDENCIES
      # ---------------------------------------------------------
      - name: Get Dependencies
        run: |
          rm -f pubspec.lock
          flutter pub get

      # ---------------------------------------------------------
      # PATCH FLUTTER_TTS FOR AGP 9
      # ---------------------------------------------------------
      - name: Patch flutter_tts for AGP 9
        run: |
          TTS_DIR="$HOME/.pub-cache/hosted/pub.dev/flutter_tts-4.2.5/android"
          TTS_BUILD="$TTS_DIR/build.gradle"

          echo "flutter_tts location:"
          echo "$TTS_BUILD"

          if [ ! -f "$TTS_BUILD" ]; then
            echo "ERROR: flutter_tts build.gradle was not found"
            exit 1
          fi

          echo "===== ORIGINAL flutter_tts build.gradle ====="
          cat "$TTS_BUILD"

          # Remove the old Kotlin Android plugin.
          sed -i "/kotlin-android/d" "$TTS_BUILD"
          sed -i "/org.jetbrains.kotlin.android/d" "$TTS_BUILD"

          # Add compileSdk if the plugin does not define one.
          if ! grep -q "compileSdk" "$TTS_BUILD"; then
            sed -i '1i android {\n    compileSdk 36\n}' "$TTS_BUILD"
          fi

          echo "===== PATCHED flutter_tts build.gradle ====="
          cat "$TTS_BUILD"

      # ---------------------------------------------------------
      # PATCH ANY OTHER PLUGIN USING OLD KOTLIN PLUGIN
      # ---------------------------------------------------------
      - name: Patch Android Plugins for AGP 9
        run: |
          echo "Searching pub cache for old Kotlin Android plugin..."

          find "$HOME/.pub-cache/hosted/pub.dev" \
            -path "*/android/build.gradle" \
            -type f \
            -print0 | while IFS= read -r -d '' file; do

              if grep -qE "kotlin-android|org.jetbrains.kotlin.android" "$file"; then
                echo "Patching: $file"

                sed -i "/kotlin-android/d" "$file"
                sed -i "/org.jetbrains.kotlin.android/d" "$file"
              fi
          done

      # ---------------------------------------------------------
      # CONFIGURE APP KOTLIN
      # ---------------------------------------------------------
      - name: Configure Kotlin
        run: |
          if [ -f android/settings.gradle.kts ]; then

            python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/settings.gradle.kts")
          s = p.read_text()

          s = re.sub(
              r'id"org\.jetbrains\.kotlin\.android"\s+version\s+"[^"]+"\s+apply\s+false',
              'id("org.jetbrains.kotlin.android") version "2.2.20" apply false',
              s
          )

          p.write_text(s)
          PY

          fi

          echo "===== KOTLIN CONFIG ====="
          grep "org.jetbrains.kotlin.android" android/settings.gradle.kts || true

      # ---------------------------------------------------------
      # AGP 9 CONFIGURATION
      # ---------------------------------------------------------
      - name: Configure Android Gradle
        run: |
          touch android/gradle.properties

          sed -i '/^android\.builtInKotlin=/d' android/gradle.properties
          sed -i '/^android\.newDsl=/d' android/gradle.properties

          echo "android.builtInKotlin=true" >> android/gradle.properties
          echo "android.newDsl=false" >> android/gradle.properties

          echo "===== gradle.properties ====="
          cat android/gradle.properties

      # ---------------------------------------------------------
      # VERIFY FLUTTER TTS PATCH
      # ---------------------------------------------------------
      - name: Verify flutter_tts
        run: |
          TTS_BUILD="$HOME/.pub-cache/hosted/pub.dev/flutter_tts-4.2.5/android/build.gradle"

          echo "===== flutter_tts FINAL CONFIG ====="
          cat "$TTS_BUILD"

          echo ""
          echo "===== CHECKING FOR OLD KOTLIN PLUGIN ====="

          if grep -qE "kotlin-android|org.jetbrains.kotlin.android" "$TTS_BUILD"; then
            echo "ERROR: Old Kotlin plugin still exists in flutter_tts"
            exit 1
          fi

          echo "flutter_tts Kotlin plugin successfully removed."

      # ---------------------------------------------------------
      # BUILD APK
      # ---------------------------------------------------------
      - name: Build Release APK
        run: |
          flutter build apk \
            --release \
            --android-skip-build-dependency-validation

      # ---------------------------------------------------------
      # VERIFY APK
      # ---------------------------------------------------------
      - name: Verify APK
        run: |
          echo "===== APK GENERATED ====="

          ls -lh build/app/outputs/flutter-apk/app-release.apk

          test -f build/app/outputs/flutter-apk/app-release.apk

      # ---------------------------------------------------------
      # COPY APK
      # ---------------------------------------------------------
      - name: Copy APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
            ../app-release-${GITHUB_REF_NAME}.apk

      # ---------------------------------------------------------
      # CREATE GITHUB RELEASE
      # ---------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Flutter APK ${{ github.ref_name }}"
          generate_release_notes: true
          files: app-release-${{ github.ref_name }}.apk
