name: Build Flutter APK Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Detect Project Directory
        id: dir_check
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "TARGET_DIR=." >> $GITHUB_ENV
          elif [ -f "neural_companion/pubspec.yaml" ]; then
            echo "TARGET_DIR=neural_companion" >> $GITHUB_ENV
          else
            echo "::error::Could not find pubspec.yaml in root or neural_companion/"
            exit 1
          fi

      - name: Print Environment
        working-directory: ${{ env.TARGET_DIR }}
        run: |
          echo "Target Directory: $PWD"
          flutter --version
          dart --version

      - name: Fetch Dependencies
        working-directory: ${{ env.TARGET_DIR }}
        run: |
          flutter clean
          flutter pub get

      - name: Dart Analyze
        working-directory: ${{ env.TARGET_DIR }}
        run: |
          dart analyze --no-fatal-infos

      - name: Build Release APK
        working-directory: ${{ env.TARGET_DIR }}
        run: |
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ env.TARGET_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.TARGET_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
