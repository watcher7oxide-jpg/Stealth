name: Build Flutter APK Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: autonomous_companion

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ---------------------------------------------------------
      # FILE PICKER
      # ---------------------------------------------------------
      - name: Fix file_picker Version
        run: |
          sed -i 's/file_picker: .*/file_picker: ^11.0.3/' pubspec.yaml

          echo "===== FILE PICKER ====="
          grep "file_picker:" pubspec.yaml

      # ---------------------------------------------------------
      # CLEAN
      # ---------------------------------------------------------
      - name: Clean Flutter
        run: |
          flutter clean
          rm -rf build
          rm -rf .dart_tool
          rm -rf android/.gradle
          rm -rf ~/.gradle/caches
          rm -rf ~/.gradle/wrapper/dists

      # ---------------------------------------------------------
      # GET DEPENDENCIES
      # ---------------------------------------------------------
      - name: Get Dependencies
        run: |
          rm -f pubspec.lock
          flutter pub get

      # ---------------------------------------------------------
      # PATCH FLUTTER TTS FOR AGP 9
      # ---------------------------------------------------------
      - name: Patch flutter_tts for AGP 9
        run: |
          TTS_BUILD="$HOME/.pub-cache/hosted/pub.dev/flutter_tts-4.2.5/android/build.gradle"

          echo "===== ORIGINAL flutter_tts ====="
          cat "$TTS_BUILD"

          python3 - "$TTS_BUILD" <<'PY'
          import sys
          import re
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          # -----------------------------------------------------
          # Remove old Kotlin Android plugin
          # -----------------------------------------------------
          text = re.sub(
              r'^\s*apply plugin:\s*[\'"]kotlin-android[\'"].*$',
              '',
              text,
              flags=re.MULTILINE
          )

          text = re.sub(
              r'^\s*apply plugin:\s*[\'"]org\.jetbrains\.kotlin\.android[\'"].*$',
              '',
              text,
              flags=re.MULTILINE
          )

          text = re.sub(
              r'^\s*id\s+[\'"]org\.jetbrains\.kotlin\.android[\'"].*$',
              '',
              text,
              flags=re.MULTILINE
          )

          # -----------------------------------------------------
          # Remove old kotlinOptions block
          #
          # Handles common forms such as:
          #
          # kotlinOptions {
          #     jvmTarget = '1.8'
          # }
          #
          # and:
          #
          # kotlinOptions { jvmTarget = '1.8' }
          # -----------------------------------------------------
          text = re.sub(
              r'\n\s*kotlinOptions\s*\{[^{}]*\}',
              '',
              text,
              flags=re.DOTALL
          )

          # -----------------------------------------------------
          # Ensure compileSdk exists
          # -----------------------------------------------------
          if not re.search(r'\bcompileSdk(?:Version)?\s+', text):
              text = (
                  'android {\n'
                  '    compileSdk 36\n'
                  '}\n\n'
                  + text
              )

          path.write_text(text)

          print("===== PATCHED flutter_tts =====")
          print(path.read_text())
          PY

      # ---------------------------------------------------------
      # PATCH OTHER FLUTTER PLUGINS FOR AGP 9
      # ---------------------------------------------------------
      - name: Patch Other Android Plugins
        run: |
          echo "Searching Flutter plugins..."

          find "$HOME/.pub-cache/hosted/pub.dev" \
            -path "*/android/build.gradle" \
            -type f \
            -print0 | while IFS= read -r -d '' file; do

              if grep -qE "kotlin-android|org.jetbrains.kotlin.android|kotlinOptions" "$file"; then

                echo ""
                echo "Patching:"
                echo "$file"

                python3 - "$file" <<'PY'
          import sys
          import re
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          # Remove old Kotlin Android plugin declarations.
          text = re.sub(
              r'^\s*apply plugin:\s*[\'"]kotlin-android[\'"].*$',
              '',
              text,
              flags=re.MULTILINE
          )

          text = re.sub(
              r'^\s*apply plugin:\s*[\'"]org\.jetbrains\.kotlin\.android[\'"].*$',
              '',
              text,
              flags=re.MULTILINE
          )

          text = re.sub(
              r'^\s*id\s+[\'"]org\.jetbrains\.kotlin\.android[\'"].*$',
              '',
              text,
              flags=re.MULTILINE
          )

          # Remove obsolete kotlinOptions blocks.
          text = re.sub(
              r'\n\s*kotlinOptions\s*\{[^{}]*\}',
              '',
              text,
              flags=re.DOTALL
          )

          path.write_text(text)
          PY

              fi
          done

      # ---------------------------------------------------------
      # CONFIGURE PROJECT KOTLIN
      # ---------------------------------------------------------
      - name: Configure Kotlin
        run: |
          if [ -f android/settings.gradle.kts ]; then

            python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/settings.gradle.kts")
          s = p.read_text()

          s = re.sub(
              r'id"org\.jetbrains\.kotlin\.android"\s+version\s+"[^"]+"\s+apply\s+false',
              'id("org.jetbrains.kotlin.android") version "2.2.20" apply false',
              s
          )

          p.write_text(s)
          PY

          fi

          echo "===== KOTLIN ====="
          grep "org.jetbrains.kotlin.android" android/settings.gradle.kts || true

      # ---------------------------------------------------------
      # AGP 9 CONFIGURATION
      # ---------------------------------------------------------
      - name: Configure Android Gradle
        run: |
          touch android/gradle.properties

          sed -i '/^android\.builtInKotlin=/d' android/gradle.properties
          sed -i '/^android\.newDsl=/d' android/gradle.properties

          echo "android.builtInKotlin=true" >> android/gradle.properties
          echo "android.newDsl=false" >> android/gradle.properties

          echo "===== GRADLE PROPERTIES ====="
          cat android/gradle.properties

      # ---------------------------------------------------------
      # VERIFY FLUTTER TTS
      # ---------------------------------------------------------
      - name: Verify flutter_tts
        run: |
          TTS_BUILD="$HOME/.pub-cache/hosted/pub.dev/flutter_tts-4.2.5/android/build.gradle"

          echo "===== FINAL flutter_tts BUILD FILE ====="
          cat "$TTS_BUILD"

          echo ""
          echo "===== CHECKING OLD KOTLIN PLUGIN ====="

          if grep -qE "kotlin-android|org.jetbrains.kotlin.android" "$TTS_BUILD"; then
            echo "ERROR: Old Kotlin plugin still exists."
            exit 1
          fi

          echo ""
          echo "===== CHECKING OLD kotlinOptions ====="

          if grep -q "kotlinOptions" "$TTS_BUILD"; then
            echo "ERROR: Old kotlinOptions block still exists."
            exit 1
          fi

          echo ""
          echo "flutter_tts AGP 9 patch verified."

      # ---------------------------------------------------------
      # BUILD
      # ---------------------------------------------------------
      - name: Build Release APK
        run: |
          flutter build apk \
            --release \
            --android-skip-build-dependency-validation

      # ---------------------------------------------------------
      # VERIFY APK
      # ---------------------------------------------------------
      - name: Verify APK
        run: |
          echo "===== APK GENERATED ====="

          ls -lh build/app/outputs/flutter-apk/app-release.apk

          test -f build/app/outputs/flutter-apk/app-release.apk

      # ---------------------------------------------------------
      # COPY APK
      # ---------------------------------------------------------
      - name: Copy APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
            ../app-release-${GITHUB_REF_NAME}.apk

      # ---------------------------------------------------------
      # CREATE GITHUB RELEASE
      # ---------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Flutter APK ${{ github.ref_name }}"
          generate_release_notes: true
          files: app-release-${{ github.ref_name }}.apk
