# ==============================================================================
# JVM MEMORY CONFIGURATION
# ==============================================================================
org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# ==============================================================================
# CI/HEADLESS RUNNER STABILITY (DISABLES WATCHER & LOCK CORRUPTIONS)
# ==============================================================================
# Prevents "Already watching path" file-lock crash on GitHub Actions runners
org.gradle.daemon=false
org.gradle.vfs.watch=false

# Disable configuration cache to prevent missing intermediate task dependency errors on Gradle 8/9
org.gradle.configuration-cache=false
org.gradle.caching=false
org.gradle.parallel=true

# ==============================================================================
# ANDROID & GRADLE COMPATIBILITY
# ==============================================================================
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
android.builder.sdkDownload=true

# Bypass broken metadata checks on third-party AAR packages (like file_picker)
android.disableAarMetadataCheck=true
