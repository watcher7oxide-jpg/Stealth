# ==============================================================================
# JVM & MEMORY ALLOCATION
# ==============================================================================
# Allocate 4GB heap to Gradle daemon to prevent Java OutOfMemoryError during 
# C++/NDK link steps and large AAR packaging.
org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# ==============================================================================
# GRADLE PERFORMANCE & EXECUTION
# ==============================================================================
# Enable Gradle daemon for faster subsequent builds
org.gradle.daemon=true

# Execute independent tasks in parallel
org.gradle.parallel=true

# Cache task outputs across builds to save compilation time
org.gradle.caching=true

# Enable configuration caching for modern Gradle versions
org.gradle.configuration-cache=true

# ==============================================================================
# ANDROID COMPATIBILITY & SUPPORT
# ==============================================================================
# Enable AndroidX support libraries
android.useAndroidX=true

# Automatically convert third-party libraries using legacy support libraries to AndroidX
android.enableJetifier=true

# Enforce non-transitive R classes to speed up incremental builds
android.nonTransitiveRClass=true

# Suppress obsolete dependency warnings during build
android.builder.sdkDownload=true
