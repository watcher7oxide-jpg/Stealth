publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.5
  speech_to_text: ^7.0.0
  file_picker: ^11.0.3
  path_provider: ^2.1.4
  share_plus: ^10.1.0
  shared_preferences: ^2.3.2
  fllama:
    git:
      url: https://github.com/Telosnex/fllama.git
      ref: main

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
